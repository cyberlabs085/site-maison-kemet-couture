<svg width="1520" height="440" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MAISON KEMET Lockup">
  <title>MAISON KEMET — Official Lockup</title>
  
    <defs>
      <linearGradient id="brandGrad_jj0kwz" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E5C365"/>
        <stop offset="50%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
      <linearGradient id="brandGrad_jj0kwz_accent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#E5C365"/>
      </linearGradient>
    </defs>
  
  <rect width="760" height="220" fill="#07070A"/>
  
  <!-- Symbole centré optiquement à gauche (x:40, y:35, échelle 150x150) -->
  <g id="lockup-symbol" transform="translate(45, 35) scale(0.5859)">
    
      <g transform="translate(128, 128)">
        <polygon points="0,-88 76,-44 0,0 -76,-44" fill="url(#brandGrad_jj0kwz_accent)"/>
        <polygon points="0,0 76,-44 76,44 0,88" fill="url(#brandGrad_jj0kwz)" opacity="0.95"/>
        <polygon points="0,0 0,88 -76,44 -76,-44" fill="url(#brandGrad_jj0kwz)" opacity="0.75"/>
        <circle cx="0" cy="0" r="16" fill="#07070A"/>
        <circle cx="0" cy="0" r="10" fill="url(#brandGrad_jj0kwz_accent)"/>
      </g>
    
  </g>

  <!-- Ligne de séparation architecturale subtile -->
  <line x1="220" y1="55" x2="220" y2="165" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Typographie du Nom de Marque (Wordmark Architectural) -->
  <text x="256" y="118" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#FAF8F5" letter-spacing="4">
    MAISON KEMET
  </text>

  <!-- Slogan / Tagline avec tracking aéré -->
  <text x="258" y="152" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#E5C365" letter-spacing="5">
    L&apos;HÉRITAGE DU LUXE AFRO-CHIC
  </text>
</svg>